<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Terminal IDE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a4e"/>
      <stop offset="100%" stop-color="#1e2a3a"/>
    </linearGradient>
    <linearGradient id="java" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a05a"/>
      <stop offset="100%" stop-color="#d97830"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d6e6ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d6e6ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Lighter tile so logo stays visible on dark chrome -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)" stroke="#94a3b8" stroke-width="3"/>

  <!-- Terminal — bright cyan frame -->
  <rect x="36" y="52" width="184" height="152" rx="14" fill="url(#term)" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="56" cy="70" r="5" fill="#ff6b63"/>
  <circle cx="74" cy="70" r="5" fill="#ffd060"/>
  <circle cx="92" cy="70" r="5" fill="#3ddc68"/>

  <text x="52" y="108" font-family="ui-monospace, Consolas, monospace" font-size="22" fill="#4ade80" font-weight="700">&gt;_</text>
  <rect x="52" y="124" width="96" height="8" rx="3" fill="#93c5fd"/>
  <rect x="52" y="142" width="128" height="8" rx="3" fill="#7dd3fc"/>
  <rect x="52" y="160" width="72" height="8" rx="3" fill="#67e8f9"/>

  <!-- Coffee cup -->
  <g transform="translate(148, 128)">
    <path d="M28 8 C28 -2, 40 -2, 40 8 C40 16, 28 14, 28 24" fill="none" stroke="url(#steam)" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 6 C44 -4, 56 -4, 56 6 C56 14, 44 12, 44 22" fill="none" stroke="url(#steam)" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 28 h52 c2 0 4 2 4 4 v28 c0 16 -14 28 -30 28 s-30 -12 -30 -28 v-28 c0 -2 2 -4 4 -4 z" fill="url(#java)"/>
    <path d="M74 36 h10 c10 0 16 8 16 18 s-6 18 -16 18 h-10" fill="none" stroke="#f0b070" stroke-width="7" stroke-linecap="round"/>
    <path d="M28 36 h12 c1 0 2 1 2 2 v18 c0 1 -1 2 -2 2 h-8" fill="#ffd0a0" opacity="0.5"/>
    <ellipse cx="44" cy="90" rx="34" ry="7" fill="#b86a30"/>
  </g>
</svg>
