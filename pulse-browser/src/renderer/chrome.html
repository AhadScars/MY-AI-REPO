<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https: http:;" />
  <title>Pulse Browser</title>
  <link rel="stylesheet" href="chrome.css" />
</head>
<body>
  <div id="app">
    <!-- Tab strip (+ button is inserted after the active tab in chrome.js) -->
    <div id="tabstrip" class="tabstrip">
      <div id="tabs" class="tabs" role="tablist"></div>
      <button id="btn-new-tab" class="icon-btn new-tab-btn" title="New Tab (Ctrl+T)" aria-label="New Tab" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="tabstrip-spacer"></div>
    </div>

    <!-- Navigation toolbar -->
    <div id="toolbar" class="toolbar">
      <div class="nav-group">
        <button id="btn-back" class="icon-btn" title="Back (Alt+←)" disabled aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="btn-forward" class="icon-btn" title="Forward (Alt+→)" disabled aria-label="Forward">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button id="btn-reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload">
          <svg id="icon-reload" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          <svg id="icon-stop" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        </button>
        <button id="btn-home" class="icon-btn" title="Home" aria-label="Home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1V10.5z"/></svg>
        </button>
      </div>

      <div class="omnibox-wrap">
        <div id="omnibox" class="omnibox">
          <span id="secure-icon" class="secure-icon" title="">
            <svg id="icon-lock" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <svg id="icon-info" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          </span>
          <input id="url-input" type="text" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Search Google or type a URL" />
          <button id="btn-bookmark" class="icon-btn omnibox-action" title="Bookmark (Ctrl+D)" aria-label="Bookmark">
            <svg id="icon-star" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          </button>
        </div>
        <div id="suggest" class="suggest hidden" role="listbox"></div>
      </div>

      <div class="nav-group">
        <button id="btn-downloads" class="icon-btn" title="Downloads (Ctrl+J)" aria-label="Downloads">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
        </button>
        <button id="btn-menu" class="icon-btn hamburger-btn" title="Menu" aria-label="Menu" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Bookmarks bar -->
    <div id="bookmarks-bar" class="bookmarks-bar"></div>

    <!-- Loading progress -->
    <div id="progress" class="progress hidden"><div class="progress-bar"></div></div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="chrome.js"></script>
</body>
</html>
