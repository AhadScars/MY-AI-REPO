services:
  mysql:
    image: mysql:8.0
    container_name: showspot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: showspot
      MYSQL_DATABASE: showspot
      MYSQL_USER: showspot
      MYSQL_PASSWORD: showspot
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - showspot_mysql:/var/lib/mysql

volumes:
  showspot_mysql:
